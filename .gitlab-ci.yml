stages:
  - deploy

deploy:
  stage: deploy
  image: ubuntu:22.04
  only:
    - main
  before_script:
    - apt-get update -q && apt-get install -y openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H $SERVER_HOST >> ~/.ssh/known_hosts
  script:
  - ssh $SERVER_USER@$SERVER_HOST "
      export NVM_DIR=\"\$HOME/.nvm\" &&
      [ -s \"\$NVM_DIR/nvm.sh\" ] && . \"\$NVM_DIR/nvm.sh\" &&
      cd /var/www/elmas-web &&
      git pull origin main &&
      npm install &&
      npm install sharp &&
      npm run build &&
      pm2 restart elmas-web || pm2 start 'npm run start' --name elmas-web
    "